spring.application.name=logwarden
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true
server.error.include-message=always

# Database: H2 in memory unless DATABASE_URL (or JDBC_DATABASE_URL) is set; see LogwardenApplication.
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:h2:mem:logwarden;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
spring.datasource.username=${JDBC_DATABASE_USERNAME:sa}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=200
spring.jpa.properties.hibernate.order_inserts=true
spring.flyway.enabled=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# LogWarden
logwarden.zone=America/St_Vincent
logwarden.work-start-hour=7
logwarden.work-end-hour=19
logwarden.web-host=web01
logwarden.bad-ips=203.0.113.66,203.0.113.67,198.51.100.77,203.0.113.200
logwarden.group-window-minutes=30
logwarden.retention-days=30
logwarden.api-key=${LOGWARDEN_API_KEY:}
logwarden.admin-password=${LOGWARDEN_ADMIN_PASSWORD:logwarden-admin}
logwarden.analyst-password=${LOGWARDEN_ANALYST_PASSWORD:logwarden-demo}
logwarden.demo-data=${LOGWARDEN_DEMO_DATA:true}
logwarden.max-upload-lines=200000
